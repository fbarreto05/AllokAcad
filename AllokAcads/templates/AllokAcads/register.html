<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>AllokAcad | Criar conta </title>
        {% load static %}
        <link rel="icon" href="/static/images/icon-allokacad.png" type="image/png">
        <link rel="stylesheet" href="{% static 'css/reset.css' %}">
        <link rel="stylesheet" href="{% static 'css/responsive.css' %}">
        <link rel="stylesheet" href="{% static 'css/register.css' %}">
    </head>
    <body>
        <div class="container">
            <div class="sidebar">
                <div class="sidebar-bg"></div>
                <div class="sidebar-overlay"></div>
                <div class="logo-container">
                    <img src="{% static 'images/allokacad-logo-white.png' %}" alt="AllokAcad" class="logo">
                    <p>Sistema de Atribuição de Aulas para Professores</p>
                    {% if messages %}
                        <ul class="messages">
                            {% for message in messages %}
                            <li class="alert {{ message.tags }}">{{ message }}</li>
                            {% endfor %}
                        </ul>
                    {% endif %}
                </div>
            </div>
            <div class="login-form">
                <div class="form-container">
                    <img src="{% static 'images/allokacad-logo-blue.png' %}" alt="AllokAcad" class="form-logo">
                    <h2>Crie sua conta</h2>
                    <p class="subtitle">Preencha seus dados para começar</p>
                    
                    <form action="{% url 'register_validate' %}" method="post" novalidate>
                        {% csrf_token %}
                        <div class="form-group">
                            <label for="name">Nome completo</label>
                            <input type="text" id="name" name="name" placeholder="Seu nome completo">
                            <span class="error-message" id="nameError"></span>
                        </div>

                        <label for="ambientid">Sua instituição de ensino:</label>
                        <select id="ambientid" name="ambientid">
                            <option selected>Sua instituição de ensino: </option>
                            {% for tambient in ambients %}
                                <option value={{tambient.ambientid}}>{{tambient.name}}</option>
                            {% endfor %}
                            <br>
                        </select>

                        <div class="form-group">
                            <label for="email">E-mail</label>
                            <input type="email" id="email" name="email" placeholder="Seu e-mail">
                            <span class="error-message" id="emailError"></span>
                        </div>

                        <div class="form-group">
                            <label for="password">Senha</label>
                            <div class="password-input-container">
                                <input type="password" id="password" name="password" placeholder="••••••••">
                                <button type="button" class="toggle-password" aria-label="Mostrar/ocultar senha">
                                    <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                        <circle cx="12" cy="12" r="3"></circle>
                                    </svg>
                                    <svg class="eye-off-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                        <line x1="1" y1="1" x2="23" y2="23"></line>
                                    </svg>
                                </button>
                            </div>
                            <span class="error-message" id="passwordError"></span>
                        </div>

                        <div class="form-group">
                            <label for="birthdate">Data de nascimento</label>
                            <input type="date" id="birthdate" name="birthdate">
                            <span class="error-message" id="birthdateError"></span>
                        </div>

                        <button type="submit" class="register-button" id="submit" name="submit">Criar conta</button>
                    </form>
                    
                    <p class="login-link">
                        Já tem uma conta? <a href="{% url 'login' %}">Faça login</a>
                    </p>

                </div>
            </div>
        </div>
        <script src="{% static 'js/register.js' %}"></script>
    </body>
</html>
