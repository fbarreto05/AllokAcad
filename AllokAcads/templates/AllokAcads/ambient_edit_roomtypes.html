{% include 'AllokAcads/ambient_bar.html' %}

{% block content %}

        {% csrf_token %}
        <br>
        <label for="name">Nome</label>
        <input type="text" id="name" name="name" value="{{ roomtype.name }}" required><br>

        <button type="submit" id="submit" name="submit">Editar</button>
    </form>
{% endblock content %}
