<!DOCTYPE html>
<html lang="pt-BR">    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{% block title %}AllokAcad{% endblock %}</title>
        {% load static %}
        <link rel="icon" href="/static/images/icon-allokacad.png" type="image/png">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="{% static 'css/reset.css' %}">
        <link rel="stylesheet" href="{% static 'css/sidebar.css' %}">
        <link rel="stylesheet" href="{% static 'css/responsive.css' %}">
        {% block extra_css %}{% endblock %}
    </head>
    <body class="{% block body_class %}page-with-sidebar{% endblock %}">
        
        <button id="menu-toggle" class="menu-toggle" aria-label="Abrir menu">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>

        <div class="sidebar-overlay"></div>
        
        <div class="container">
            <nav class="sidebar">
                <div class="logo-container">
                    <img src="{% static 'images/allokacad-logo-white.png' %}" alt="AllokAcad" class="logo">
                </div>
                
                <div class="user-info">
                    <div class="user-avatar">
                        {% if user.picture %}
                        <img src="{{ user.picture.url }}" alt="{{ user.name }}">
                        {% else %}
                        <div class="user-initial">{{ user.name|default:"I"|make_list|first|upper }}</div>
                        {% endif %}
                    </div>
                    <div class="user-text">
                        <span class="welcome-text">Bem-vindo(a),</span>
                        <h2 class="username" title="{{ user.name }}">{{ user.name|default:"Usuário" }}</h2>
                    </div>
                </div>
                
                <div class="nav-links">
                    <a href="{% url 'home'  %}" class="nav-link">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                            <polyline points="9 22 9 12 15 12 15 22"></polyline>
                        </svg>
                        Início
                    </a>

                    <a href="{% url 'dashboard_app:professor_dashboard' %}" class="nav-link">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="20" x2="18" y2="10"></line>
                            <line x1="12" y1="20" x2="12" y2="4"></line>
                            <line x1="6" y1="20" x2="6" y2="14"></line>
                        </svg>
                        Dashboards
                    </a>
                    
                    <a href="{% url 'profile'  %}" class="nav-link">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        Perfil
                    </a>
                </div>
                
                <a href="{% url 'exit' %}" class="logout">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    Sair
                </a>
            </nav>
            
            <main class="main-content">
            {% block content %}{% endblock %}
            </main>
        </div>

        <script src="{% static 'js/sidebar.js' %}"></script>
        {% block extra_js %}{% endblock %}
        
    </body>
</html>
