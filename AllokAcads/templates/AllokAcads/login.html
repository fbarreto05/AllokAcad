<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>AllokAcad | Login </title>
        {% load static %}
        <link rel="icon" href="/static/images/icon-allokacad.png" type="image/png">
        <link rel="stylesheet" href="{% static 'css/reset.css' %}">
        <link rel="stylesheet" href="{% static 'css/login.css' %}">
        <link rel="stylesheet" href="{% static 'css/responsive.css' %}">
    </head>
    <body>
        <div class="container">
            <div class="sidebar">
                <div class="sidebar-bg"></div>
                <div class="sidebar-overlay"></div>
                <div class="logo-container">
                    <img src="{% static 'images/allokacad-logo-white.png' %}" alt="AllokAcad" class="logo">
                    <p>Sistema de Atribuição de Aulas para Professores</p>
                </div>
            </div>
            <div class="login-form">
                <div class="form-container">
                    <img src="{% static 'images/allokacad-logo-blue.png' %}" alt="AllokAcad" class="form-logo">
                    <h2>Bem-vindo(a) de volta</h2>
                    <p class="subtitle">Entre com suas credenciais para continuar</p>
                    
                    <form id="loginForm" action="{% url 'login_validate' %}" method="post">
                        {% csrf_token %}
                        <div class="form-group">
                            <label for="identifier">Identificador</label>
                            <input type="text" id="identifier" placeholder="Seu identificador">
                            <span class="error-message" id="identifierError"></span>
                        </div>
                        
                        <div class="form-group">
                            <label for="password">Senha</label>
                            <input type="password" id="password" placeholder="••••••••">
                            <span class="error-message" id="passwordError"></span>
                        </div>
                        
                        <div class="form-options">
                            <div class="remember-me">
                                <input type="checkbox" id="remember">
                                <label for="remember">Lembrar de mim</label>
                            </div>
                        </div>
                        
                        <button type="submit" class="login-button">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;">
                                <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                                <polyline points="10 17 15 12 10 7"></polyline>
                                <line x1="15" y1="12" x2="3" y2="12"></line>
                            </svg>
                            Entrar
                        </button>
                    </form>
                    
                    <p class="register-link">
                        Não tem uma conta? <a href="{% url 'register' %}">Cadastre-se</a>
                    </p>
                </div>
            </div>
        </div>
        <script src="{% static 'js/login.js' %}"></script>
    </body>
</html>
